name: Wattwise CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wattwise-api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Backend Dependencies
        run: npm install

      - name: Check Backend Starts
        run: node -e "require('./index.js')"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wattwise-web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build