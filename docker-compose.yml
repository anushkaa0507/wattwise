version: "3.9"

services:
  backend:
    build: ./wattwise-api
    container_name: wattwise-backend
    ports:
      - "5000:5000"
    env_file:
      - ./wattwise-api/.env
    restart: always

  frontend:
    build:
      context: ./wattwise-web
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_API_URL: ${VITE_API_URL}
    container_name: wattwise-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always